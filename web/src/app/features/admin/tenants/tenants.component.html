<app-page-header
  title="Tenants"
  description="Every workspace on the platform, with plan, seats and quota consumption."
  [breadcrumbs]="[{ label: 'Platform', route: null }, { label: 'Tenants', route: null }]"
>
  <button appButton variant="outline" size="md">
    <app-icon name="download" [size]="16" />
    Export
  </button>
  <button appButton size="md">
    <app-icon name="plus" [size]="16" />
    New workspace
  </button>
</app-page-header>

<section class="mt-6 grid gap-4 sm:grid-cols-2 xl:grid-cols-4" aria-label="Platform totals">
  <app-stat-card
    label="Workspaces"
    icon="building"
    [value]="totals().workspaces"
    [loading]="state() === 'loading'"
  />
  <app-stat-card
    label="Active"
    icon="checkCircle"
    [value]="totals().active"
    [loading]="state() === 'loading'"
  />
  <app-stat-card
    label="Total seats"
    icon="users"
    [value]="totals().seats"
    [loading]="state() === 'loading'"
  />
  <app-stat-card
    label="Messages this month"
    icon="send"
    [value]="totals().messages"
    [loading]="state() === 'loading'"
  />
</section>

<app-data-table
  class="mt-5 block"
  [columns]="columns"
  [rows]="tenants()"
  [state]="state()"
  [page]="page()"
  [pageSize]="pageSize()"
  [totalItems]="totalItems()"
  emptyTitle="No workspaces yet"
  emptyDescription="Workspaces appear here as soon as they are provisioned."
  (pageChange)="onPageChange($event)"
  (pageSizeChange)="onPageSizeChange($event)"
  (retry)="load()"
>
  <div tableToolbar class="flex w-full items-center justify-between gap-3">
    <div>
      <h2 class="text-sm font-semibold text-ink">All workspaces</h2>
      <p class="mt-0.5 text-xs text-ink-muted">Sorted by creation date</p>
    </div>
  </div>

  <ng-template [appTableRow]="tenants()" let-tenant>
    <td class="px-4 py-3.5">
      <div class="flex items-center gap-3">
        <span
          class="grid h-9 w-9 shrink-0 place-items-center rounded-lg bg-brand-50 text-xs font-semibold text-brand-700"
        >
          {{ tenant.name.charAt(0) }}
        </span>
        <div class="min-w-0">
          <p class="truncate text-sm font-medium text-ink">{{ tenant.name }}</p>
          <p class="truncate text-xs text-ink-muted">{{ tenant.ownerEmail }}</p>
        </div>
      </div>
    </td>

    <td class="hidden px-4 py-3.5 md:table-cell">
      <app-badge [tone]="planTone[tenant.plan]">{{ tenant.plan }}</app-badge>
    </td>

    <td class="px-4 py-3.5">
      <app-badge [tone]="statusTone[tenant.status]" [dot]="true">{{ tenant.status }}</app-badge>
    </td>

    <td class="hidden px-4 py-3.5 text-right text-sm text-ink-soft tabular-nums md:table-cell">
      {{ tenant.seats }}
    </td>

    <td class="px-4 py-3.5">
      <div class="flex items-center justify-end gap-2.5">
        <div class="hidden h-1.5 w-16 overflow-hidden rounded-full bg-surface-sunken sm:block">
          <div
            class="h-full rounded-full transition-all duration-500"
            [class]="quotaBarClass(tenant)"
            [style.width.%]="quotaPercent(tenant)"
          ></div>
        </div>
        <span class="w-9 text-right text-sm font-semibold text-ink tabular-nums">
          {{ quotaPercent(tenant) }}%
        </span>
      </div>
    </td>

    <td class="hidden px-4 py-3.5 text-right text-sm whitespace-nowrap text-ink-muted md:table-cell">
      {{ tenant.createdAt | timeAgo }}
    </td>
  </ng-template>
</app-data-table>
