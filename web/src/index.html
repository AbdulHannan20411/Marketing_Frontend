<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>NextReach</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#16a34a" />
    <meta name="description" content="Multi-tenant WhatsApp marketing platform." />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Applied before first paint. Angular bootstraps too late to avoid a
      // white flash for anyone on the dark theme, so the attribute is set here
      // and ThemeService takes over once it starts.
      (function () {
        try {
          var stored = localStorage.getItem('vd.theme');
          document.documentElement.setAttribute(
            'data-theme',
            stored === 'light' || stored === 'dark' ? stored : 'system',
          );
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'system');
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
